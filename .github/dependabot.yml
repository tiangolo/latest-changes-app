version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels:
      - internal
      - dependencies
      - github_actions
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ⬆
    labels:
      - internal
      - dependencies
      - python:uv
    groups:
      python-packages:
        patterns:
          - "*"
