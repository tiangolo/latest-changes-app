name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release bump
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      date:
        description: Release date in YYYY-MM-DD format. Defaults to today.
        required: false
        type: string

permissions: {}

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "latest-known"
          enable-cache: false
      - name: Install dependencies
        run: uv sync --locked
      - name: Prepare release
        run: uv run python scripts/prepare_release.py prepare
        env:
          PREPARE_RELEASE_BUMP: ${{ inputs.bump }}
          PREPARE_RELEASE_DATE: ${{ inputs.date }}
      - name: Update lockfile
        run: uv lock
      - name: Get release version
        id: release-version
        run: |
          version="$(uv run python scripts/prepare_release.py current-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Get PR Submit token
        id: pr-submit
        uses: tiangolo/pr-submit@0.0.1
      - name: Create release pull request
        env:
          GH_TOKEN: ${{ steps.pr-submit.outputs.token }}
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail
          branch="release-${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "pr-submit[bot]"
          git config user.email "pr-submit[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add pyproject.toml release-notes.md uv.lock
          git commit -m "🔖 Release version ${VERSION}"
          gh auth setup-git
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "🔖 Release version ${VERSION}" --body "Prepare release ${VERSION}." --label release
