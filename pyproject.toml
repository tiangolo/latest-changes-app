[project]
name = "latest-changes-app"
version = "0.0.5"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "prek>=0.5.7",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "typer>=0.27.3",
    "ty>=0.0.91",
    "zizmor>=1.31.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=100"
pythonpath = ["."]
testpaths = ["tests"]
